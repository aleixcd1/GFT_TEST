services:
  app:
    build: .
    container_name: prices-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: prices_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

  postgres:
    image: postgres:15
    container_name: prices-db
    environment:
      POSTGRES_DB: prices_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prices_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
